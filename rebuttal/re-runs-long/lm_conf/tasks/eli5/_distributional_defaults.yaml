rounds: 1
seed: 42
dataset_name: eli5 # must match the folder name under tasks/
dataset_path: sentence-transformers/eli5
subset: null
split: train
few_shot_split: train
few_shot_examples: 0
# NOTE: intentionally null. sentence-transformers/eli5 has 325k rows and only
# a "train" split; DatasetsManager.get_dataset() would *randomly* sample
# `limit` rows if set here, but we want a deterministic "first 800 questions"
# slice instead, so the truncation happens in task_utils.preprocess_dataset.
limit: null
results_path: null
filtered_output_path: null
graded_outputs_path: null
cache_path: null
dataset_preprocessor: task_utils.preprocess_dataset

# placeholder variables must match the dataset column names, formatted using Jinja2
question_format: "{{question.strip()}}"   # question formatting template
prompt_format: |
  Answer the following question with a complete, well-reasoned explanation. Provide the relevant background, reasoning, and detail needed to fully address the question, similar to how one would explain it to a curious layperson. Do not artificially cut your answer short.

  Question: {{formatted_question}}
  Answer:

system_prompt: ""
prompt_formatter: direct_free_form_qa
generation_type: generation
output_filters: null
confidence_metrics: null
grader: llm_grader
performance_metrics:
  - accuracy_scalar_with_abstention
  - faithfulness_divergence
  - generalised_ece
  - dECE_point_mass
  - dAUROC
  - AUROC_point_mass

qa_model:
  backend: vllm
  name: openai/gpt-oss-20b
  repeat: 20
  stop_sequences: []
  temperature: 1
  max_tokens: 512
  max_model_len: 2048
  reasoning_effort: low
  seed: null


grader_model:
  backend: vllm
  name: openai/gpt-oss-20b
  repeat: 1
  temperature: 0
  max_tokens: 256
  max_model_len: 4096
  reasoning_effort: low


clustering_model:
  backend: vllm
  name: openai/gpt-oss-20b
  repeat: 1
  stop_sequences: []
  temperature: 0
  max_tokens: 1024
  max_model_len: 16384
  reasoning_effort: low
