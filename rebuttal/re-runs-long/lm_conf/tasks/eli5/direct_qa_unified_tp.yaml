defaults:
  - _distributional_defaults.yaml
  - _self_


prompt_format: |
  Answer the following question with a complete, well-reasoned explanation. Provide the relevant background, reasoning, and detail needed to fully address the question, similar to how one would explain it to a curious layperson. Do not artificially cut your answer short.

  Question: {{formatted_question}}
  Answer:
output_filters: null
confidence_metrics: distributional_length_normalised_log_likelihood

qa_model:
  repeat: 20
  temperature: 1

evaluator_list:
  - linguistic_confidence_judge_model_0
  - linguistic_confidence_judge_model_1
  - linguistic_confidence_judge_model_2

linguistic_confidence_judge_model_0:
  backend: vllm
  name: mistralai/Mistral-7B-Instruct-v0.3
  repeat: 3
  temperature: 1
  max_tokens: 512
  logprobs: 1
  reasoning_effort: low


linguistic_confidence_judge_model_1:
  backend: vllm
  name: meta-llama/Llama-3.1-8B-Instruct
  repeat: 3
  temperature: 1
  max_tokens: 512
  logprobs: 1
  reasoning_effort: low


linguistic_confidence_judge_model_2:
  backend: vllm
  name: qwen/Qwen3-8B
  repeat: 3
  temperature: 1
  max_tokens: 512
  logprobs: 1
  reasoning_effort: null
